<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0284C7" />
    <title>HySafe is offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f0f9ff;
        color: #0f172a;
        font-family: Georgia, "Times New Roman", serif;
      }
      main {
        max-width: 420px;
        text-align: center;
      }
      h1 {
        font-size: 28px;
        margin-bottom: 8px;
      }
      p {
        font-family: Arial, sans-serif;
        line-height: 1.5;
        color: #334155;
      }
      button {
        margin-top: 16px;
        background: #0284c7;
        color: white;
        border: 0;
        border-radius: 12px;
        padding: 12px 18px;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>HySafe</h1>
      <p>You are offline. Orders, bills, and delivery updates need a connection and were not changed.</p>
      <p>Reconnect, then try again. Nothing was submitted in the background.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
