<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HySafe" />
    <title>%WEB_TITLE%</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        background-color: #f0f9ff;
      }
      #root {
        display: flex;
        height: 100%;
        max-width: 100%;
        flex: 1;
      }
    </style>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          var isLocal = location.hostname === "localhost" || location.hostname === "127.0.0.1";
          var isExpoDevServer = isLocal && (location.port === "8081" || location.port === "19006");
          if (isExpoDevServer) return;
          if (location.protocol !== "https:" && !isLocal) return;

          navigator.serviceWorker.register("/sw.js").then(function (registration) {
            registration.addEventListener("updatefound", function () {
              var installing = registration.installing;
              if (!installing) return;
              installing.addEventListener("statechange", function () {
                if (installing.state === "installed" && navigator.serviceWorker.controller) {
                  window.dispatchEvent(new Event("hysafe-sw-update"));
                }
              });
            });
          }).catch(function (error) {
            console.warn("Service worker registration failed", error);
          });
        });
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run HySafe.</noscript>
    <div id="root"></div>
  </body>
</html>
